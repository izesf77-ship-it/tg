# ==========================================================
#  Telegram Chat Constructor Bot — запуск через Docker Compose
# ==========================================================
#  Подготовка:
#    cp .env.example .env      # вписать BOT_TOKEN и ADMIN_IDS
#    docker compose up -d
#
#  Логи:     docker compose logs -f
#  Остановка: docker compose down
#  Пересборка: docker compose up -d --build
# ==========================================================

services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: chat-constructor-bot:latest
    container_name: chat-constructor-bot
    restart: unless-stopped

    # Переменные окружения берутся из файла .env
    env_file:
      - .env
    environment:
      # Гарантируем пути внутри контейнера
      DB_PATH: /app/data/bot.sqlite3
      FONTS_DIR: /app/fonts
      LANG: C.UTF-8
      TZ: ${TZ:-Europe/Moscow}
      PYTHONUNBUFFERED: "1"
      # Полная самопроверка рендерера при старте (медленно, ~20 с)
      RUN_SELFCHECK: "${RUN_SELFCHECK:-0}"

    volumes:
      # Постоянные данные: БД, загруженные фото, последние рендеры
      # Владелец 10001:10001 = пользователь appuser внутри образа.
      # Если хост монтирует каталог от root, задайте на хосте
      #   chown -R 10001:10001 <путь-к-volume>
      # либо добавьте в этот сервис   user: "0:0"  (контейнер от root).
      - bot_data:/app/data

    # Бот работает через long polling, но платформа (Traefik) ждёт HTTP
    # на порту из PORT — иначе домен отдаёт 502 Bad Gateway.
    ports:
      - "${PORT:-8080}:${PORT:-8080}"

    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request,sys; p=os.environ.get('PORT','8080'); r=urllib.request.urlopen('http://127.0.0.1:%s/health'%p,timeout=5); sys.exit(0 if r.status==200 else 1)"]
      interval: 60s
      timeout: 10s
      start_period: 60s
      retries: 3

volumes:
  bot_data:
    driver: local
